<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Fork & Flame</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background-color: #fdf8f2; }
    .navbar-brand { font-weight: 700; font-size: 1.4rem; letter-spacing: 0.5px; }
    .menu-card { transition: transform 0.2s, box-shadow 0.2s; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .menu-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
    .category-badge { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .price-tag { font-size: 1.2rem; font-weight: 700; color: #d97706; }
    .cart-total-box { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .order-card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-radius: 12px; }
    .qty-btn { width: 32px; height: 32px; padding: 0; line-height: 1; }
    .admin-table th { background: #f8f9fa; }
    .page-header { background: linear-gradient(135deg, #d97706 0%, #92400e 100%); color: white; padding: 2rem 0; margin-bottom: 2rem; }
    .filter-btn.active { background-color: #d97706 !important; border-color: #d97706 !important; color: white !important; }
    .filter-btn { border-color: #d97706; color: #d97706; }
    .filter-btn:hover { background-color: #d97706; border-color: #d97706; color: white; }
    [v-cloak] { display: none; }
  </style>
</head>
<body>

<div id="app" v-cloak>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #92400e;">
    <div class="container">
      <a class="navbar-brand" href="#">
        <i class="bi bi-fire me-2"></i>The Fork &amp; Flame
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item">
            <router-link class="nav-link" to="/" exact-active-class="active">
              <i class="bi bi-menu-button-wide me-1"></i>Menu
            </router-link>
          </li>
          <li class="nav-item">
            <router-link class="nav-link" to="/cart" exact-active-class="active">
              <i class="bi bi-cart3 me-1"></i>Cart
              <span v-if="cartCount > 0" class="badge bg-warning text-dark ms-1">{{ cartCount }}</span>
            </router-link>
          </li>
          <li class="nav-item">
            <router-link class="nav-link" to="/orders" exact-active-class="active">
              <i class="bi bi-clock-history me-1"></i>Orders
            </router-link>
          </li>
          <li class="nav-item">
            <router-link class="nav-link" to="/admin" exact-active-class="active">
              <i class="bi bi-gear me-1"></i>Admin
            </router-link>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Router View -->
  <router-view></router-view>

  <!-- Toast Notification -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive">
      <div class="d-flex">
        <div class="toast-body">{{ toastMessage }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
<script src="app.js"></script>
</body>
</html>
